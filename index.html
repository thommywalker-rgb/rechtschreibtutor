<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rechtschreibtutor</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
}

textarea{
    width:100%;
    height:300px;
    font-size:16px;
    padding:10px;
}

button{
    background:#0066cc;
    color:white;
    border:none;
    padding:12px 20px;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}

#antwort{
    margin-top:20px;
    padding:20px;
    border:1px solid #ccc;
    border-radius:5px;
}
</style>

</head>
<body>

<h1>📚 Rechtschreibtutor</h1>

<p>
Füge deinen Text ein und klicke auf «Text prüfen».
</p>

<textarea id="text"></textarea>

<br>

<button onclick="pruefen()">
Text prüfen
</button>

<div id="antwort">
Hier erscheint später die Rückmeldung.
</div>

<script>
function pruefen() {

const text = document.getElementById("text").value;

if(text.trim() === ""){
    document.getElementById("antwort").innerHTML =
    "Bitte zuerst einen Text eingeben.";
    return;
}

document.getElementById("antwort").innerHTML =
"Die KI-Anbindung folgt im nächsten Schritt.<br><br>Dein Text enthält " +
text.split(" ").length +
" Wörter.";
}
</script>

</body>
</html>
