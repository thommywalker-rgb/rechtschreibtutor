<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rechtschreibtutor</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
}

textarea{
    width:100%;
    height:250px;
    font-size:16px;
    padding:10px;
}

button{
    background:#0066cc;
    color:white;
    border:none;
    padding:12px 20px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0052a3;
}

#antwort{
    margin-top:20px;
    border:1px solid #ccc;
    padding:15px;
    border-radius:8px;
}

#vorschau{
    margin-top:10px;
    max-width:100%;
    border:1px solid #ccc;
    padding:5px;
    border-radius:8px;
    display:none;
}
</style>
</head>

<body>

<h1>📚 Rechtschreibtutor</h1>

<p>
Gib deinen Text ein oder lade ein Foto deines handgeschriebenen Textes hoch.
</p>

<h2>📝 Text eingeben</h2>

<textarea id="text"
placeholder="Schreibe oder füge hier deinen Text ein..."></textarea>

<h2>📷 Foto hochladen</h2>

<input type="file" id="bild" accept="image/*">

<br><br>

<img id="vorschau">

<br><br>

<button onclick="pruefen()">
Text prüfen
</button>

<div id="antwort">
Hier erscheint später die Rückmeldung.
</div>

<script>

document.getElementById("bild").addEventListener("change", function(event){

    const file = event.target.files[0];

    if(file){

        const reader = new FileReader();

        reader.onload = function(e){

            document.getElementById("vorschau").src =
                e.target.result;

            document.getElementById("vorschau").style.display =
                "block";
        }

        reader.readAsDataURL(file);
    }
});

function pruefen(){

    const text =
        document.getElementById("text").value.trim();

    const bild =
        document.getElementById("bild").files.length;

    if(text === "" && bild === 0){

        document.getElementById("antwort").innerHTML =
            "⚠️ Bitte einen Text eingeben oder ein Foto hochladen.";

        return;
    }

    let meldung = "✅ Eingabe erhalten<br><br>";

    if(text !== ""){

        meldung +=
            "📝 Text erkannt (" +
            text.split(/\s+/).length +
            " Wörter).<br>";
    }

    if(bild > 0){

        meldung +=
            "📷 Foto hochgeladen.<br>";
    }

    meldung +=
        "<br>🤖 Die KI-Korrektur wird im nächsten Schritt eingebaut.";

    document.getElementById("antwort").innerHTML =
        meldung;
}

</script>

</body>
</html>
